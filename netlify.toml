[build]
  # Build command - React ko chhota aur fast banata hai
  command = "cd frontend && npm run build"
  
  # Publish directory - Yahan se Netlify files lega
  publish = "frontend/build"

# Environment variables (agar zaroorat ho)
[build.environment]
  NODE_VERSION = "18"

# Redirect rules (React Router ke liye zaroori)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Headers for security and performance
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
